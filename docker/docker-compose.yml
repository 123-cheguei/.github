version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fatal-model-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fatalmodel
      POSTGRES_USER: fatalmodel
      POSTGRES_PASSWORD: fatalmodel_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fatalmodel']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fatal-model-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fatal-model-redis
    restart: unless-stopped
    command: redis-server --requirepass fatalmodel_redis_password
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fatal-model-network

  # OpenSearch for AI and Search
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: fatal-model-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=FatalModel@2026
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - fatal-model-network

  # MinIO (S3-compatible storage for media)
  minio:
    image: minio/minio:latest
    container_name: fatal-model-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fatalmodel
      MINIO_ROOT_PASSWORD: fatalmodel_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fatal-model-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  opensearch_data:
    driver: local
  minio_data:
    driver: local

networks:
  fatal-model-network:
    driver: bridge
